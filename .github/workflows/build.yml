name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Restore upload key
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/upload.jks
      - name: Build debug APK
        env:
          KEYSTORE_FILE: /tmp/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Show signing certificate
        run: |
          keytool -list -v -keystore /tmp/upload.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" | grep -E "SHA1|SHA256" || true
          ls $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | head -1
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs app/build/outputs/apk/debug/*.apk 2>&1 | grep -E "Signer #1|SHA-256|SHA-1" || true
      - name: Build release AAB
        env:
          KEYSTORE_FILE: /tmp/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BeTapDem-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BeTapDem-release-aab
          path: app/build/outputs/bundle/release/*.aab
